services:
  - type: web
    name: ibrahim-studio-handbrake
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://tik-a8h.pages.dev
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: MAX_DURATION_SECONDS
        value: "600"
      - key: JOB_TTL_SECONDS
        value: "900"
