<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><link rel="stylesheet" href="../assets/css/site.css"><title>الدعم وفحص الجهاز — Ibrahim Studio</title></head>
<body><header class="top"><div class="wrap"><a class="brand" href="../">IBRAHIM STUDIO</a><nav class="nav"><a href="../studio/">الاستوديو</a><a href="../tiktok/">الرفع إلى TikTok</a><a href="../docs/">الدليل</a><a href="./">الدعم والفحص</a><a href="../account/">التفعيل</a></nav></div></header>
<main class="wrap"><section class="hero"><h1>الدعم وفحص الجهاز</h1><p class="muted">الفحص يعمل محلياً داخل المتصفح ولا يرسل تقرير الجهاز تلقائياً.</p></section>
<section class="card"><div id="state" class="status">جارٍ فحص المتصفح...</div><div id="details" class="grid" style="margin-top:12px"></div><p><button id="copy" class="button" type="button">نسخ التقرير</button> <button id="again" class="button" type="button">إعادة الفحص</button></p></section></main><footer class="wrap">لا يحتوي التقرير على معرّف جهاز ثابت أو كود تفعيل.</footer>
<script type="module">
import {detectRuntimeCapabilities,selectEngineMode} from "../assets/js/runtime-capabilities.js";
const $=id=>document.getElementById(id);let report="";
function scan(){const c=detectRuntimeCapabilities();const mode=selectEngineMode(c,{threadedBundleAvailable:false});const rows=[["HTTPS",c.secureContext?"متاح":"غير متاح"],["WebAssembly",c.wasm?"مدعوم":"غير مدعوم"],["SharedArrayBuffer",c.sharedArrayBuffer?"متاح":"غير متاح"],["COOP/COEP isolation",c.crossOriginIsolated?"مفعّل":"غير مفعّل"],["الذاكرة التقريبية",c.deviceMemoryGB?c.deviceMemoryGB+" GB":"غير متاحة"],["الأنوية المنطقية",c.hardwareConcurrency??"غير متاح"],["الشاشة",screen.width+" × "+screen.height+" · DPR "+devicePixelRatio],["خطة المحرك",mode],["المتصفح",c.userAgent]];report="تقرير Ibrahim Studio\n"+rows.map(r=>r.join(": ")).join("\n");$("state").textContent=c.secureContext&&c.wasm?"الفحص الأساسي ناجح. سيُستخدم Single-Thread حتى تتوفر حزمة متعددة الخيوط مختبرة.":"المتصفح يحتاج HTTPS وWebAssembly للمعالجة."; $("details").innerHTML=rows.map(([k,v])=>'<div class="item"><b>'+k+'</b><div class="muted">'+String(v).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))+'</div></div>').join("");}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(report);$("state").textContent="تم نسخ التقرير؛ أرسله للدعم إذا رغبت."}catch{$("state").textContent=report}};$("again").onclick=scan;scan();
</script></body></html>
